# Builds the desktop apps (Windows / macOS / Linux) when you push a tag like v1.0.1,
# and attaches them to a GitHub Release. Can also be run manually from the Actions tab.
name: Build desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @neutralinojs/neu
      - run: neu update
      - run: neu build --release --embed-resources
      - uses: actions/upload-artifact@v4
        with:
          name: LariStudio-desktop
          path: dist/LariStudio/*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LariStudio/LariStudio-win_x64.exe
            dist/LariStudio/LariStudio-mac_universal
            dist/LariStudio/LariStudio-linux_x64
